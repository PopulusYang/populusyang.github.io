<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>今天吃什么</title>
    <link rel="stylesheet" href="statics/css/dice.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
</head>

<body>
    <main class="stage">
        <div class="top-nav">
            <a class="nav-link" href="index.html">返回猎人小屋</a>
            <a class="nav-link" href="reviewed.html">去看已评测</a>
        </div>

        <h1>今天吃什么</h1>
        <p id="slotHint" class="slot-hint">正在判断时段...</p>
        <p class="rule">时段规则：08:30 前为早餐，08:30-14:59 为午餐，15:00 后为晚餐。</p>
        <p id="dbMeta" class="db-meta"></p>
        <div id="status" class="status">正在加载数据库...</div>

        <div class="dice-wrap">
            <div id="dice" class="dice" aria-live="polite" role="button" tabindex="0" aria-label="点击骰子开始摇菜">
                <div id="diceFace" class="dice-face">准备开摇</div>
            </div>
        </div>

        <p id="rollLimitHint" class="roll-limit-hint" aria-live="polite"></p>

        <section class="filter-panel" aria-labelledby="canteenFilterTitle">
            <div class="filter-head">
                <p id="canteenFilterTitle" class="filter-title">排除食堂</p>
                <button id="clearCanteenFilter" class="filter-clear" type="button">清空排除</button>
            </div>
            <p id="canteenFilterHint" class="filter-hint">正在加载食堂列表...</p>
            <div id="canteenFilterList" class="canteen-filter-list" role="group" aria-label="可排除的食堂列表"></div>
            <div class="score-filter" aria-labelledby="scoreFilterTitle">
                <p id="scoreFilterTitle" class="score-filter-title">评分筛选</p>
                <div class="score-filter-grid">
                    <div class="score-filter-field">
                        <label for="scoreMinInput">最低评分</label>
                        <input id="scoreMinInput" type="number" min="0" max="5" step="0.1" placeholder="0.0">
                    </div>
                    <div class="score-filter-field">
                        <label for="scoreMaxInput">最高评分</label>
                        <input id="scoreMaxInput" type="number" min="0" max="5" step="0.1" placeholder="5.0">
                    </div>
                </div>
                <p id="scoreFilterHint" class="filter-hint">默认显示 0 到 5 分的全部菜品。</p>
                <div class="score-filter-actions">
                    <button id="applyScoreFilter" class="score-filter-button score-apply" type="button">应用评分筛选</button>
                    <button id="clearScoreFilter" class="score-filter-button score-clear" type="button">清空评分筛选</button>
                </div>
            </div>
        </section>

        <section id="result" class="result hidden" aria-live="polite">
            <h2 id="dishName"></h2>
            <p id="dishMeta"></p>
            <p id="dishLinkWrap" class="dish-link-wrap hidden">
                <a id="dishLink" class="dish-link" href="#" target="_blank" rel="noopener noreferrer">查看详情链接</a>
            </p>
            <p id="embedWarning" class="embed-warning hidden"></p>
            <div id="detailContainer" class="detail-container hidden">
                <div class="detail-title">详情预览</div>
                <iframe id="detailFrame" class="detail-frame" title="详情预览"></iframe>
                <p class="detail-tip">部分网站可能限制嵌入显示，若空白请点击上方详情链接。</p>
            </div>
        </section>

        <section class="history-panel" aria-live="polite">
            <p class="history-title">随机记录（<span id="historyCount">0</span>/5）</p>
            <ol id="historyList" class="history-list"></ol>
            <p id="historyEmpty" class="history-empty">还没有摇过，先来一次试试。</p>
        </section>

        <footer class="site-copyright">&copy; 2026 PopulusYang 版权所有 | <a href="LICENSE" target="_blank"
                rel="noopener noreferrer">MIT 协议</a></footer>
    </main>

    <script src="statics/js/dice.js"></script>
</body>

</html>
