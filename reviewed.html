<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>食堂菜品评分榜</title>
    <link rel="stylesheet" href="statics/css/reviewed.css">
    <!-- 引入 sql.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        .ambient-glow {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(212,137,58,0.10), transparent 70%);
            animation: warm-pulse 5s ease-in-out infinite;
        }
        .ambient-glow--1 {
            top: -8%; right: -8%;
            width: 40vw; height: 40vw;
            max-width: 400px; max-height: 400px;
            animation-delay: 0s;
        }
        .ambient-glow--2 {
            bottom: -12%; left: -8%;
            width: 50vw; height: 50vw;
            max-width: 450px; max-height: 450px;
            animation-delay: 2.5s;
        }
        @keyframes warm-pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }
    </style>
</head>

<body>
    <div class="ambient-glow ambient-glow--1" aria-hidden="true"></div>
    <div class="ambient-glow ambient-glow--2" aria-hidden="true"></div>

    <div class="container">
        <div class="page-nav">
            <a class="page-link" href="index.html">返回猎人小屋</a>
            <a class="page-link" href="dice.html">今天吃什么</a>
        </div>
        <h1>食堂菜品评分榜</h1>
        <div class="toolbar">
            <input id="searchInput" class="search-input" type="text" placeholder="搜索菜名、食堂或供应时段...">
            <button class="search-button" onclick="applySearch()">搜索</button>
            <button class="clear-button" onclick="clearSearch()">清除</button>
            <button class="download-button" onclick="downloadDatabaseCsv()">下载数据库（CSV）</button>
        </div>
        <div id="resultHint" class="result-hint"></div>
        <div id="dbMeta" class="db-meta"></div>
        <div id="status" class="loading">正在加载数据库...</div>
        <table id="menuTable" style="display: none;">
            <thead>
                <tr>
                    <th width="8%" data-sort-key="id">编号</th>
                    <th width="20%" data-sort-key="name">菜品名称</th>
                    <th width="15%" data-sort-key="canteen">食堂</th>
                    <th width="8%" data-sort-key="rating">评分</th>
                    <th width="20%" data-sort-key="meal_type">供应时段</th>
                    <th width="10%" data-sort-key="is_active">状态</th>
                    <th width="10%" data-sort-key="official_link">详情</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 数据将插入这里 -->
            </tbody>
        </table>

        <footer class="site-copyright">&copy; 2026 PopulusYang 版权所有 | <a href="LICENSE" target="_blank"
                rel="noopener noreferrer">MIT 协议</a></footer>
    </div>

    <script src="statics/js/common.js"></script>
    <script src="statics/js/reviewed.js"></script>

</body>

</html>
