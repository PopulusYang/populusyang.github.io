<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>猎人小屋</title>
    <link rel="stylesheet" href="statics/css/index.css">
</head>

<body>
    <main class="panel">
        <h1>猎人小屋</h1>
        <p class="subtitle">今天是想稳妥进食，还是让骰子替你做决定？</p>

        <section class="module-row" aria-label="功能模块">
            <a class="module-button today" href="dice.html" aria-label="进入今天吃什么模块">
                <div class="module-label">今天吃什么</div>
                <p class="module-desc">进入摇骰子页面，按当前时段随机抽取可吃菜品。</p>
            </a>

            <a class="module-button rated" href="reviewed.html" aria-label="进入已评测模块">
                <div class="module-label">已评测</div>
                <p class="module-desc">查看和搜索全部已收录菜品评分，并支持按列排序。</p>
            </a>

            <a class="module-button today" href="about.html" aria-label="进入关于猎人小屋页面">
                <div class="module-label">关于猎人小屋</div>
                <p class="module-desc">了解这个小站的用途、数据来源和维护方式。</p>
            </a>
        </section>

        <section class="friends-section" aria-labelledby="friendsTitle">
            <div class="friends-head">
                <h2 id="friendsTitle" class="friends-title">友情链接</h2>
                <p id="friendsHint" class="friends-hint">正在加载友链...</p>
            </div>
            <div id="friendsGrid" class="friends-grid" aria-live="polite"></div>
            <p id="friendsEmpty" class="friends-empty hidden">暂无友情链接。</p>
        </section>

        <footer class="site-copyright">&copy; 2026 PopulusYang 版权所有 | <a href="LICENSE" target="_blank"
                rel="noopener noreferrer">MIT 协议</a></footer>
    </main>

    <script src="statics/js/common.js"></script>
    <script src="statics/js/index.js"></script>
</body>

</html>
